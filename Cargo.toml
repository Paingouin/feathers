[package]
name = "feathers"
version = "0.1.0"
edition = "2024"
description = "A pack-driven textual world explorer: Rust engine, Lua worlds."

[dependencies]
crossterm = "0.29"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
